name: Share a translation → pull request

# Two ways in, for "Share a translation" issues:
#
# - An issue is opened or edited: the bot says what happens with the file in one comment (updated on every edit):
#   which language it is, every pack of that language that's already here, and whether it updates one of them or
#   becomes a new pack. If the person who opened it is one of the owners of the pack it updates
#   (.github/pack-owners.json: its creators, plus anyone a maintainer added), and the update keeps the pack's code
#   and people (tools/author_update.py), the file is checked and published to main right away, and the issue is
#   closed. Anyone else's issue waits for a maintainer.
#
# - A maintainer adds the "create-pr" label: the file goes where it says (its "code" is the folder; the pack with the
#   same code and variant is updated, else it's a new pack), is checked, and a pull request that closes the issue
#   is opened. Only people who can
#   triage issues can add labels. If something's wrong, it says so on the issue and removes the label.
#
# The issue's text is untrusted: it only reaches tools/issue_to_pack.py through an environment variable, and that
# script only reads it and the attached file as data.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write        # push the translation/issue-<n> branch
  pull-requests: write   # open the pull request
  issues: write          # comment on the issue, remove the label, close it

concurrency:
  group: share-translation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  share:
    if: >-
      !github.event.issue.pull_request && github.event.issue.state == 'open' &&
      (github.event.action != 'labeled' || github.event.label.name == 'create-pr')
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.action == 'labeled' && 'label' || 'auto' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      BRANCH: translation/issue-${{ github.event.issue.number }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      # the deploy key lets an author's update onto main (the ruleset lets deploy keys through)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PUBLISH_DEPLOY_KEY }}

      - name: Read the issue and its file
        id: pack
        run: python3 tools/issue_to_pack.py

      - name: Check the pack
        if: steps.pack.outputs.path
        env:
          PACK_PATH: ${{ steps.pack.outputs.path }}
        run: |
          if ! GITHUB_ACTIONS=false python3 tools/build_index.py --check "$PACK_PATH" > "$RUNNER_TEMP/check.txt" 2>&1; then
            cat "$RUNNER_TEMP/check.txt"
            {
              echo "I couldn't use this file yet: it has problems the app or the check refuses."
              echo
              echo '```'
              head -c 6000 "$RUNNER_TEMP/check.txt"
              echo '```'
              echo
              echo "Fix them in the app (**⋮ → Edit texts**), save the file again and attach it to this issue (edit the issue). Most often it's a \`{placeholder}\` that was translated or renamed: keep each one exactly as in English."
            } > "$RUNNER_TEMP/pack-comment.md"
            exit 1
          fi
          cat "$RUNNER_TEMP/check.txt"

      - name: Set up git
        if: steps.pack.outputs.action == 'pr' || steps.pack.outputs.action == 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------------------------- an author's update: publish it
      - name: Publish the author's update
        if: steps.pack.outputs.action == 'publish'
        env:
          PACK_PATH: ${{ steps.pack.outputs.path }}
        run: |
          git add -- "$PACK_PATH"
          if git diff --cached --quiet; then
            echo "The published pack already has exactly these texts and authors, so there was nothing to change." >> "$RUNNER_TEMP/pack-info.md"
            exit 0
          fi
          git commit --quiet -F "$RUNNER_TEMP/pack-commit.txt"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$BASE"; then
              echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD). The app offers the update within a few minutes. Thanks!" >> "$RUNNER_TEMP/pack-info.md"
              exit 0
            fi
            git pull --rebase --quiet origin "$BASE"
          done
          exit 1

      # ---------------------------------------------------------------- everyone: what happens with the file
      - name: Say what happens with this file
        if: steps.pack.outputs.action == 'inform' || steps.pack.outputs.action == 'review' || steps.pack.outputs.action == 'publish'
        run: tools/sticky_comment.sh "$ISSUE_NUMBER" "$RUNNER_TEMP/pack-info.md"

      - name: Close the issue once it's published
        if: steps.pack.outputs.action == 'publish'
        run: gh issue close "$ISSUE_NUMBER"

      # ---------------------------------------------------------------- the create-pr label: a pull request
      - name: Commit it to a branch
        if: steps.pack.outputs.action == 'pr'
        env:
          PACK_PATH: ${{ steps.pack.outputs.path }}
        run: |
          git checkout -B "$BRANCH"
          git add -- "$PACK_PATH"
          if git diff --cached --quiet; then
            echo "The pack published now already has exactly these texts and authors: nothing to change." > "$RUNNER_TEMP/pack-comment.md"
            exit 1
          fi
          git commit --quiet -F "$RUNNER_TEMP/pack-commit.txt"
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open the pull request
        if: steps.pack.outputs.action == 'pr'
        env:
          TITLE: ${{ steps.pack.outputs.title }}
          DETECTED: ${{ steps.pack.outputs.detected }}
        run: |
          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$TITLE" --body-file "$RUNNER_TEMP/pack-pr.md"
            verb="updated"
          else
            url=$(gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pack-pr.md")
            verb="made"
          fi
          # GitHub holds the check on a pull request opened by a workflow until a maintainer clicks
          # "Approve workflows to run" on it (the pull request's description says so)
          gh issue comment "$ISSUE_NUMBER" --body "Thanks! I $verb a pull request with your translation ($DETECTED): $url

          Once it's reviewed and merged, the language shows up in the app within a few minutes. This issue closes then."
          gh issue edit "$ISSUE_NUMBER" --remove-label create-pr

      - name: Tell the issue what went wrong
        if: failure()
        run: |
          if [ ! -s "$RUNNER_TEMP/pack-comment.md" ]; then
            echo "Something went wrong while handling this file. A maintainer will look at it: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/pack-comment.md"
          fi
          if [ "$MODE" = "auto" ]; then
            # the same comment that says what happens with the file, so it always shows the latest state
            tools/sticky_comment.sh "$ISSUE_NUMBER" "$RUNNER_TEMP/pack-comment.md"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/pack-comment.md"
            gh issue edit "$ISSUE_NUMBER" --remove-label create-pr || true
          fi
