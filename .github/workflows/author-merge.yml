name: Authors update their own packs

# When the check passes on a pull request that changes one existing pack, and the pull request's author is one of
# that pack's owners (.github/pack-owners.json on main: its creators, plus anyone a maintainer added), this approves
# and merges it, so owners can keep their language up to date without waiting for a maintainer. Being in a pack's
# "authors" is credit only. tools/author_update.py has the rules: the update keeps the pack's language code, removes
# nobody from "authors", doesn't drop more than 20% of the texts and doesn't bring back texts older than the published
# ones (tools/pack_history.py: an update made on an old copy of the pack).
# Anything else waits for a maintainer as usual.
#
# It runs after "Check language packs" (workflow_run), in this repository with main's own files: it never runs code
# from the pull request, it only reads the changed pack as JSON data.
on:
  workflow_run:
    workflows: ["Check language packs"]
    types: [completed]

permissions:
  contents: write        # merge
  pull-requests: write   # approve, comment
  actions: write         # start the publish workflow (a merge made by a workflow doesn't start it)

concurrency:
  group: author-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0          # the pack's history: tools/pack_history.py compares the update with it
          persist-credentials: false

      - name: Find the pull request and what it changes
        id: pr
        run: |
          gh pr list --state open --base "$BASE" --limit 200 --json number,headRefOid,author,isDraft > "$RUNNER_TEMP/prs.json"
          pr=$(jq -c --arg sha "$HEAD_SHA" '[.[] | select(.headRefOid == $sha and (.isDraft | not))] | first // empty' "$RUNNER_TEMP/prs.json")
          if [ -z "$pr" ]; then echo "No open pull request is at $HEAD_SHA (closed, a draft, or new commits since)."; exit 0; fi
          number=$(jq -r '.number' <<<"$pr")
          login=$(jq -r '.author.login' <<<"$pr")
          if ! [[ "$login" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then echo "#$number is by $login (a bot or an app): skipped"; exit 0; fi

          gh api "repos/$GH_REPO/pulls/$number/files" --paginate --jq '.[] | [.status, .filename] | @tsv' > "$RUNNER_TEMP/files.tsv"
          if [ "$(wc -l < "$RUNNER_TEMP/files.tsv")" -ne 1 ]; then echo "#$number changes more than one file: a maintainer reviews it"; exit 0; fi
          IFS=$'\t' read -r status file < "$RUNNER_TEMP/files.tsv"
          if [ "$status" != "modified" ] || ! [[ "$file" =~ ^languages/[A-Za-z0-9-]+/[a-z0-9-]+\.json$ ]] || [ ! -f "$file" ]; then
            echo "#$number doesn't just update a pack that's on $BASE ($status $file): a maintainer reviews it"; exit 0
          fi

          # the pack as main would have it after the merge (GitHub's merge preview), as data: nothing from the pull
          # request is checked out or run. Judging the merge, not the branch, means a branch that's only behind
          # main doesn't look like it brings back older texts.
          git fetch --no-tags --quiet origin "refs/pull/$number/merge" || { echo "#$number can't be merged as it is: a maintainer reviews it"; exit 0; }
          merge=$(git rev-parse FETCH_HEAD)
          if [ "$(git rev-parse "$merge^2")" != "$HEAD_SHA" ]; then echo "#$number: GitHub's merge preview isn't for $HEAD_SHA (new commits?): their check decides"; exit 0; fi
          git show "$merge:$file" > "$RUNNER_TEMP/updated.json"
          { echo "number=$number"; echo "login=$login"; echo "file=$file"; } >> "$GITHUB_OUTPUT"

      - name: Is it one of the pack's owners, keeping the pack's code and people?
        id: author
        if: steps.pr.outputs.number
        env:
          PACK: ${{ steps.pr.outputs.file }}
          LOGIN: ${{ steps.pr.outputs.login }}
        run: python3 tools/author_update.py "$PACK" "$RUNNER_TEMP/updated.json" "$LOGIN"

      - name: Approve and merge
        if: steps.author.outputs.ok == 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          LOGIN: ${{ steps.pr.outputs.login }}
          PACK: ${{ steps.pr.outputs.file }}
        run: |
          gh pr review "$NUMBER" --approve --body "@$LOGIN is one of the owners of \`$PACK\`, and the check passed: merging it automatically."
          gh pr merge "$NUMBER" --merge --match-head-commit "$HEAD_SHA"
          gh workflow run publish.yml --ref "$BASE"
          gh pr comment "$NUMBER" --body "Merged ✅ Thanks, @$LOGIN! The app offers the update within a few minutes."

      - name: Tell the owner why a maintainer has to look at it
        if: steps.author.outputs.author == 'true' && steps.author.outputs.ok != 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          {
            echo "Thanks! You're one of this pack's owners, but this pull request needs a maintainer's review because:"
            echo
            cat "$RUNNER_TEMP/author-reasons.md"
            echo
            echo "A maintainer will look at it soon."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"

      - name: Say so if the merge failed
        if: failure() && steps.author.outputs.ok == 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr comment "$NUMBER" --body "I couldn't merge this automatically. A maintainer will look at it." || true

  # Every pull request that updates packs (from anyone): one comment, updated on each push, when it would bring back
  # texts older than the published ones. A pull request is merged as it is (the form only takes the changed texts),
  # so this tells its author what to fix, and the maintainer sees it before approving.
  history-note:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      BASE: ${{ github.event.repository.default_branch }}
      MARK: '<!-- pack-history-note -->'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compare the updated packs with their history
        run: |
          [ -f tools/pack_history.py ] || exit 0
          gh pr list --state open --base "$BASE" --limit 200 --json number,headRefOid,author > "$RUNNER_TEMP/prs.json"
          pr=$(jq -c --arg sha "$HEAD_SHA" '[.[] | select(.headRefOid == $sha)] | first // empty' "$RUNNER_TEMP/prs.json")
          if [ -z "$pr" ]; then echo "No open pull request is at $HEAD_SHA"; exit 0; fi
          number=$(jq -r '.number' <<<"$pr")
          login=$(jq -r '.author.login' <<<"$pr")
          # the bot's own pull requests (from Share a translation issues) have this in their description already
          if ! [[ "$login" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then echo "#$number is by $login: skipped"; exit 0; fi

          # what main would get after the merge, read as data (nothing from the pull request is run)
          git fetch --no-tags --quiet origin "refs/pull/$number/merge" || { echo "#$number can't be merged as it is"; exit 0; }
          merge=$(git rev-parse FETCH_HEAD)
          if [ "$(git rev-parse "$merge^2")" != "$HEAD_SHA" ]; then echo "#$number has new commits: their check decides"; exit 0; fi

          : > "$RUNNER_TEMP/note.md"
          git diff --name-only --no-renames --diff-filter=M HEAD "$merge" | { grep -E '^languages/[A-Za-z0-9-]+/[a-z0-9-]+\.json$' || true; } | while read -r f; do
            git show "$merge:$f" > "$RUNNER_TEMP/updated.json"
            python3 tools/pack_history.py "$f" "$RUNNER_TEMP/updated.json" --note "$RUNNER_TEMP/note.md"
          done

          if [ -s "$RUNNER_TEMP/note.md" ]; then
            {
              echo "$MARK"
              echo "### Compared with the published pack"
              echo
              cat "$RUNNER_TEMP/note.md"
              echo "**How to fix it:** for 🕰️ and 🇬🇧 texts, put the published text back in your file (see the pack on \`$BASE\`), or start again from the newest version: in an up-to-date app, download the language again and redo your changes. For ⚠️ texts, a maintainer picks one. This note updates when you push again."
            } > "$RUNNER_TEMP/comment.md"
            tools/sticky_comment.sh "$number" "$RUNNER_TEMP/comment.md" "$MARK"
          else
            # an earlier note on this pull request is out of date now: say it's fixed
            old=$(gh api "repos/$GH_REPO/issues/$number/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARK\"))) | .id" | tail -n 1)
            if [ -n "$old" ]; then
              printf '%s\n### Compared with the published pack\n\n✅ Fixed: this pull request no longer brings back older texts.\n' "$MARK" > "$RUNNER_TEMP/comment.md"
              tools/sticky_comment.sh "$number" "$RUNNER_TEMP/comment.md" "$MARK"
            else
              echo "Nothing older is brought back."
            fi
          fi
