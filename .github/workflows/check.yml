name: Check language packs

# Runs on every pull request (the "check" job is required before merging into main).
#
# Packs are checked with main's own tools/build_index.py and en.json, never the pull request's copy,
# so a pull request can't make its own check pass by changing the checker. Only the owner's pull requests
# are checked with their own tools (to test changes to the tools).
#
# Pull requests from anyone else may only change pack files: languages/<code>/<id>.json.
#
# workflow_dispatch runs the same check on a branch (the "Share a translation" workflow starts it on the
# pull requests it opens, because pull requests opened by a workflow don't start other workflows).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TRUSTED: ${{ github.event_name == 'pull_request' && github.event.pull_request.author_association == 'OWNER' }}
    steps:
      - name: Get main (the trusted tools and English texts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the changes to check
        run: |
          if [ -n "$PR_NUMBER" ]; then
            git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          else
            git fetch --no-tags origin "$HEAD_SHA"
          fi
          git cat-file -e "$HEAD_SHA^{commit}"

      - name: Pull requests change only pack files
        if: github.event_name == 'pull_request' && env.TRUSTED != 'true'
        run: |
          other=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | grep -vE '^languages/[A-Za-z0-9-]+/[a-z0-9-]+\.json$' || true)
          if [ -n "$other" ]; then
            echo "This pull request changes files that aren't language packs:"
            echo "$other" | sed 's/^/  /'
            echo "$other" | while read -r f; do
              echo "::error file=$f::Translation pull requests may only change pack files: languages/<code>/<id>.json, like languages/ne/ne.json (index.json and the README table are rebuilt after the merge)"
            done
            echo "A pack is languages/<code>/<id>.json: the folder is the language code, the file name is the pack's id (lowercase letters, digits and hyphens)."
            echo "Please remove the other changes, or open a separate pull request (or an issue) for them."
            exit 1
          fi
          echo "Only pack files changed."

      - name: Use the pull request's language files with main's tools
        run: |
          if [ "$TRUSTED" = "true" ]; then
            echo "The owner's pull request: checking it with its own tools"
            git checkout --quiet --detach "$HEAD_SHA"
          else
            rm -rf languages
            git checkout --quiet "$HEAD_SHA" -- languages
          fi

      - name: Check every pack
        run: python3 tools/build_index.py --check
