name: Check language packs

on:
  pull_request:
    paths:
      - 'languages/**'
      - 'en.json'
      - 'tools/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: index.json is made by the publish workflow
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'index.json'; then
            echo "::warning file=index.json::index.json is rebuilt after the merge: you don't need to change it"
          fi

      - name: Check every pack
        run: python3 tools/build_index.py --check
