name: Share a translation
description: Send a language you made or updated in the app (no git needed). We publish it and credit you.
title: "Translation: "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! In the app: **Settings → Language → ⋮ on your language → Send to the community → Save the file**,
        then attach that file below. If GitHub refuses the `.json` file, zip it first.

        **No need to say which language it is:** the file says it. If a pack with the same language code and
        variant is [already here](https://github.com/SantoshKurmi/antigem_languages#languages), your texts update
        it; otherwise it becomes a new pack. To add another style or script of a language that's here, give it a
        variant in the app first (**⋮ → Name & details**, e.g. *Formal* or *Latin letters*).
  - type: textarea
    id: authors
    attributes:
      label: Who made it
      description: One person per line. Name, GitHub username (optional) and what they did. These names are shown in the app.
      placeholder: |
        Sita Sharma, @sita-sharma, translation
        Ram Thapa, @ramthapa, review
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The file
      description: Drag the language file (or its zip) here.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Style choices, what's not done yet, whether an AI helped and who checked it.
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I agree to share this translation under GPL-3.0-or-later (the app's license), and everyone listed above agrees too.
          required: true
